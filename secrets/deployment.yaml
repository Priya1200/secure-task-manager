apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  namespace: secrets-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: secrets-demo }
  template:
    metadata:
      labels: { app: secrets-demo }
    spec:
      containers:
        - name: app
          image: sample-flask-app:1.0
          imagePullPolicy: Never
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: taskmanager-secrets, key: db_password } }
            - name: API_KEY
              valueFrom: { secretKeyRef: { name: taskmanager-secrets, key: api_key } }
