version: "3.9"

services:
  web:
    build: .
    image: sample-flask-app:1.0
    container_name: flask-container
    ports:
      - "5000:5000"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
    networks:
      - app-network

  redis:
    image: redis:alpine
    container_name: redis-container
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
