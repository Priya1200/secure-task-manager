apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flask-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Priya1200/secure-task-manager.git
    targetRevision: main
    path: gitops/app
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
