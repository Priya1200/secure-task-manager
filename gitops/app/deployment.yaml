apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-gitops
  namespace: gitops-demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: flask-gitops}
  template:
    metadata:
      labels: {app: flask-gitops}
    spec:
      containers:
      - name: flask
        image: sample-flask-app:1.0
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
